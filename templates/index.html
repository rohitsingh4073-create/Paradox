
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARADOX | Network Simulator</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>PARADOX</h1>
        <p>NETWORK RESILIENCE SIMULATOR</p>
    </header>

    <main>
        <section class="panel">
            <h2>Network Control</h2>
            <label for="link">Select a connection to break</label>
            <select id="link">
                <option value="A,B">A — B (4 ms)</option>
                <option value="A,C">A — C (2 ms)</option>
                <option value="B,D">B — D (5 ms)</option>
                <option value="C,D">C — D (8 ms)</option>
                <option value="C,E">C — E (3 ms)</option>
                <option value="D,E">D — E (2 ms)</option>
                <option value="D,F">D — F (6 ms)</option>
                <option value="E,F">E — F (3 ms)</option>
            </select>
            <button id="break-button" onclick="breakLink()">
                SIMULATE FAILURE
            </button>
            <button class="secondary" onclick="resetNetwork()">
                RESET NETWORK
            </button>
        </section>

        <section class="panel">
            <h2>Routing Analysis</h2>
            <p id="status">System initializing...</p>
            <p>Current route: <strong id="route">—</strong></p>
            <p>Simulated latency: <strong id="latency">—</strong></p>
        </section>


        <section class="panel network-panel">
            <h2>Live Network Topology</h2>
            <div id="network-graph"></div>
            <p class="legend">
                <span class="healthy-dot"></span> Active link
                <span class="failed-dot"></span> Failed link
            </p>
        </section>


        <section class="panel">
            <h2>Incident Log</h2>
            <ul id="events">
                <li>Awaiting simulation events...</li>
            </ul>
        </section>
    </main>

    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
